<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>MathQuest 정책 안내</title>
  <style>
    :root {
      --bg: #f3f5f1; --card: #ffffff; --ink: #1a1a2e; --ink-soft: #3f4454; --muted: #6b7080;
      --line: #e3e6df; --accent: #0f8b7d; --accent-soft: #e3f4f1; --chip: #f6f7f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12131c; --card: #1c1e2b; --ink: #f1f2f6; --ink-soft: #c9ccd6; --muted: #9a9fb0;
        --line: #2c2f40; --accent: #4fd1bf; --accent-soft: #173a37; --chip: #24273a;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; padding: 24px 16px 56px; background: var(--bg); color: var(--ink-soft);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.75; word-break: keep-all; overflow-wrap: break-word;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--accent); text-decoration: none; font-size: 15px; }
    .brand span { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 15px; }
    header.doc { margin: 18px 0 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.3; color: var(--ink); letter-spacing: -0.02em; }
    .dates { margin: 0; font-size: 14px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px; margin-top: 14px; }
    .intro p { margin: 0 0 12px; }
    .intro p:last-child { margin-bottom: 0; }
    .callout { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; color: var(--ink); }
    nav.toc h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
    nav.toc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
    nav.toc a { display: block; padding: 3px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.6; }
    nav.toc a:hover { background: var(--chip); }
    section h2 { margin: 0 0 10px; font-size: 20px; line-height: 1.4; color: var(--ink); scroll-margin-top: 16px; }
    section p { margin: 10px 0; }
    section > :last-child { margin-bottom: 0; }
    strong { color: var(--ink); font-weight: 700; }
    ul { margin: 10px 0; padding-left: 20px; }
    li { margin: 6px 0; }
    li::marker { color: var(--accent); }
    ul.links { list-style: none; padding: 0; display: grid; gap: 8px; }
    ul.links a { display: block; padding: 10px 14px; border-radius: 10px; background: var(--chip); }
    .table-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    th { background: var(--chip); color: var(--ink); font-weight: 700; white-space: nowrap; }
    a { color: var(--accent); text-underline-offset: 3px; }
    footer { margin-top: 28px; font-size: 14px; color: var(--muted); text-align: center; }
    footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 8px; }
    .home-list { display: grid; gap: 12px; margin-top: 18px; }
    .home-list a { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; color: var(--ink); font-weight: 700; font-size: 17px; }
    .home-list a small { display: block; margin-top: 2px; font-weight: 500; font-size: 14px; color: var(--muted); }
    .home-list a:hover { border-color: var(--accent); }
    @media (max-width: 480px) {
      body { font-size: 15px; padding-top: 18px; }
      h1 { font-size: 24px; }
      .card { padding: 18px 16px; border-radius: 16px; }
      section h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="./"><span>Q</span>MathQuest</a>
    <header class="doc">
      <h1>MathQuest 정책 안내</h1>
      <p class="dates">초·중·고등학생을 위한 무료 수학 학습 앱입니다. 회원가입이 없고 모든 학습 기록은 이용자의 기기에만 저장됩니다.</p>
    </header>
    <div class="home-list">
      <a href="./privacy_policy.html">개인정보처리방침<small>기기에 저장되는 정보와 권한 안내</small></a>
      <a href="./terms_of_service.html">이용약관<small>서비스 이용 조건과 책임 범위</small></a>
      <a href="./account_deletion.html">데이터 삭제 안내<small>앱에서 데이터를 삭제하는 방법</small></a>
    </div>
    <footer>
      <nav><a href="./">MathQuest 정책 안내</a><a href="./privacy_policy.html">개인정보처리방침</a><a href="./terms_of_service.html">이용약관</a><a href="./account_deletion.html">데이터 삭제 안내</a></nav>
      문의 · MathQuest 운영자 <a href="mailto:jjanghyoson@gmail.com">jjanghyoson@gmail.com</a>
    </footer>
  </div>
</body>
</html>
